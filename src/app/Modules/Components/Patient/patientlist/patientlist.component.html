
<app-patient-invite  [Email]="patientsinvite"  (inviteCompleted)="onInviteCompleted($event)" [hidden]="true" ></app-patient-invite>
<!-- <app-adr></app-adr> -->
<div class="container">
  <div class="card invite-card">
    <h2>My Patients</h2>
 <div class="add-button-wrapper">
  <div class="search-container">
    <i class="bi bi-search search-icon"></i>
    <input 
      type="text" 
      style="width: 55%"
      class="form-control search-box" 
      placeholder="Search patients..." 
      [(ngModel)]="searchText"
    />
  </div>
  <button class="btn btn-primary add-btn" (click)="openAddPatientDialog()">
    + Add Patient
  </button>
</div>
<div class="table-scroll-wrapper" style="height: 68vh; overflow: auto">
  <table class="full-width-table ">
    <thead>
      <tr>
        <th>Sl.No</th>
        <th>Patient Name</th>
        <th>Gender</th>
        <th>Age</th>
        <th>Email</th>
        <th>Invite Status</th>
      </tr>
    </thead>
    <tbody>
<tr 
  *ngFor="let p of patients | patientFilter:searchText; index as ID" 
  [class.clickable-row]="p.isRegistered" 
  (click)="p.isRegistered ? openPatientDetails(p) : null"
>


  <!-- If patient is already invited -->
  <ng-container *ngIf="p.sendInvite; else notInvited">
    <!-- Check if registered -->
    <ng-container *ngIf="p.isRegistered; else invitedNotRegistered">
      <!-- Invited + Registered -->
      <td>{{ ID + 1 }}</td>
      <td>{{ p.name }}</td>
      <td>{{ p.gender }}</td>
      <td>{{ p.age }}</td>
      <td>{{ p.email }}</td>
      <td>Invited</td>
    </ng-container>
  </ng-container>

  <!-- Invited but NOT Registered -->
  <ng-template #invitedNotRegistered>
    <td>{{ ID + 1 }}</td>
    <td  colspan="3" style="color: rgb(205, 61, 61);font-weight: bolder;">
      Patient not registered
    </td>
    <td>{{ p.email }}</td>
    <td>
      <div class="d-flex gap-2">
        <span>Invited</span>
        <button class="btn btn-primary add-btn" style="    margin-left: 5px"
                (click)="deletePatient(p.patientId); $event.stopPropagation()"
                title="Delete unregistered patient">
          <i class="bi bi-trash">Delete</i>
        </button>
      </div>
    </td>
  </ng-template>

  <!-- Not Invited at all -->
  <ng-template #notInvited>
    <td>{{ ID + 1 }}</td>
    <td colspan="3" style="color: rgb(255, 193, 7);font-weight: bolder;">
      Not invited
    </td>
    <td>{{ p.email }}</td>
    <td style="display: flex;">
      <button style="cursor: pointer;" class="btn btn-primary float-end"
              (click)="sendInvite(p.email); $event.stopPropagation()">
        Send Invite
      </button>
        <div class="d-flex gap-2">
        <!-- <span>Invited</span> -->
        <button class="btn btn-primary add-btn" style="    margin-left: 5px"
                (click)="deletePatient(p.patientId); $event.stopPropagation()"
                title="Delete unregistered patient">
          <i class="bi bi-trash">Delete</i>
        </button>
      </div>
    </td>
  </ng-template>

</tr>



    </tbody>
  </table>
  </div>
</div>
