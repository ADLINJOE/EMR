<div
  class="sidebar"
  [class.collapsed]="collapsed"
  [class.mobile]="isMobile"
  role="navigation"
  aria-label="Main menu"
>
  <div class="sidebar-header">
    <span class="logo" *ngIf="!collapsed">Rx Smart</span>
    <button
      class="toggle-btn"
      (click)="toggleSidebar()"
      aria-label="Toggle menu"
      [attr.aria-expanded]="!collapsed"
    >
      <span class="material-icons">{{ collapsed ? 'menu' : 'close' }}</span>
    </button>
  </div>

  <nav class="menu-section">
    <a
      class="menu-item"
      *ngFor="let item of menuItems()"
      [class.active]="isActiveRoute(item.path)"
      (click)="navigateTo(item.path)"
      href="javascript:void(0)"
      role="link"
      tabindex="0"
    >
      <span class="material-icons icon">{{ item.icon || 'medical_services' }}</span>
      <span class="title" *ngIf="!collapsed">{{ item.title }}</span>
    </a>
  </nav>
</div>

<div
  class="backdrop"
  *ngIf="showBackdrop"
  (click)="closeSidebarClick()"
  aria-hidden="true"
></div>
