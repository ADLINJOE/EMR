<div class="container">
  <div class="card">
    <h2>Drug Master</h2>

    <div class="button-row">
      <button mat-flat-button color="primary" (click)="openDrugForm()">Add Drug</button>
      <button mat-flat-button color="accent" (click)="downloadTemplate()">Download Template</button>
      <input type="file" (change)="uploadExcel($event)" accept=".xlsx" hidden #fileInput />
      <button mat-flat-button color="warn" (click)="fileInput.click()">Upload Excel</button>
      <button mat-flat-button color="primary" (click)="downloadExcel()">Download Data</button>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z4" matSort>
        <ng-container matColumnDef="drugName">
          <th mat-header-cell *matHeaderCellDef>Drug Name</th>
          <td mat-cell *matCellDef="let row">{{ row.drugName }}</td>
        </ng-container>
        <ng-container matColumnDef="genericName">
          <th mat-header-cell *matHeaderCellDef>Generic</th>
          <td mat-cell *matCellDef="let row">{{ row.genericName }}</td>
        </ng-container>
        <ng-container matColumnDef="brandName">
          <th mat-header-cell *matHeaderCellDef>Brand</th>
          <td mat-cell *matCellDef="let row">{{ row.brandName }}</td>
        </ng-container>
        <ng-container matColumnDef="drugCode">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let row">{{ row.drugCode }}</td>
        </ng-container>
        <ng-container matColumnDef="barcode">
          <th mat-header-cell *matHeaderCellDef>Barcode</th>
          <td mat-cell *matCellDef="let row">{{ row.barcode }}</td>
        </ng-container>
        <ng-container matColumnDef="strength">
          <th mat-header-cell *matHeaderCellDef>Strength</th>
          <td mat-cell *matCellDef="let row">{{ row.strength }}</td>
        </ng-container>
        <ng-container matColumnDef="dosageForm">
          <th mat-header-cell *matHeaderCellDef>Form</th>
          <td mat-cell *matCellDef="let row">{{ row.dosageForm }}</td>
        </ng-container>
        <ng-container matColumnDef="route">
          <th mat-header-cell *matHeaderCellDef>Route</th>
          <td mat-cell *matCellDef="let row">{{ row.route }}</td>
        </ng-container>
        <ng-container matColumnDef="unitPrice">
          <th mat-header-cell *matHeaderCellDef>Price</th>
          <td mat-cell *matCellDef="let row">{{ row.unitPrice | currency }}</td>
        </ng-container>
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">{{ row.status }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button (click)="editDrug(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteDrug(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnsToDisplay"></tr>
        <tr mat-row *matRowDef="let row; columns: columnsToDisplay;"></tr>
      </table>
    </div>
  </div>
</div>
